function cardLead(el){var c=el.closest("[data-card]");var id=c&&parseInt(c.dataset.card,10);return S.leads.filter(function(l){return l.id===id})[0]}
function cardFields(l){var f={},c=document.querySelector('[data-card="'+l.id+'"]');if(!c)return f;FIELDS.forEach(function(k){var el=c.querySelector('[data-f="'+k+'"]');if(el&&!el.disabled&&(el.value||"")!==(l[k]||""))f[k]=el.value});return f}

/* ---------- gestes ---------- */
function next(){S.open=null;return refresh()}
function ship(l){
  // Le lead est déjà validé par vous. Reste à le faire partir.
  if(S.st.smtp_ready){
    var cancelled=false,t=setTimeout(function(){if(!cancelled)api("/api/lead/send",{id:l.id,confirm:true}).then(function(){toast("Envoyé à "+l.contact_email);refresh()}).catch(function(e){fail(e);refresh()})},5000);
    toast("Envoi à "+l.contact_email+" dans 5 s","Annuler",function(){cancelled=true;clearTimeout(t);toast("Envoi annulé. Le message reste prêt à partir.")},5200);
    return Promise.resolve();
  }
  return api("/api/lead/send",{id:l.id,confirm:true,external:true}).then(function(){
    if(!MOCK){window.location.href="mailto:"+encodeURIComponent(l.contact_email)+"?subject="+encodeURIComponent(l.draft_subject||"")+"&body="+encodeURIComponent(l.draft_body||"")}
    toast(MOCK?"Démo : envoi simulé, rien n'est parti.":"Ouvert dans votre messagerie et noté comme envoyé.","Annuler",function(){api("/api/lead/decision",{id:l.id,decision:"annuler"}).then(refresh).catch(fail)},8000);
  });
}
function go(a,l){
  var f=cardFields(l);
  if(a==="ship"){
    var email=f.contact_email!==undefined?f.contact_email:l.contact_email;
    if(!email){var e=document.querySelector('[data-card="'+l.id+'"] [data-f="contact_email"]');if(e)e.focus();return fail(new Error("Ajoutez l'adresse e-mail du décideur, ou validez seulement."))}
    return api("/api/lead/go",{id:l.id,fields:f,mode:"valider"}).then(function(r){return ship(r.lead)}).then(next).catch(fail);
  }
  if(a==="only")return api("/api/lead/go",{id:l.id,fields:f,mode:"valider"}).then(function(){toast("Validé. Prêt à partir.","Annuler",function(){api("/api/lead/decision",{id:l.id,decision:"annuler"}).then(refresh).catch(fail)},6000);return next()}).catch(fail);
  if(a==="redraft")return api("/api/lead/redraft",{id:l.id}).then(function(){toast("Brouillon régénéré.");return refresh()}).catch(fail);
  if(a==="skip"){S.i=(S.i+1)%queue().length;return render()}
  if(a==="observe")return api("/api/lead/decision",{id:l.id,decision:"observer"}).then(function(){toast("Sous observation.");return next()}).catch(fail);
  if(a==="cancel")return api("/api/lead/decision",{id:l.id,decision:"annuler"}).then(function(){S.open=null;S.tab="today";return refresh()}).catch(fail);
}
function reject(l,reason){
  return api("/api/lead/decision",{id:l.id,decision:"rejeter",reason:reason}).then(function(){
    toast(l.company+" écarté.","Annuler",function(){api("/api/lead/decision",{id:l.id,decision:"annuler"}).then(refresh).catch(fail)},6000);return next();
  }).catch(fail);
}
function autosave(el){
  var l=cardLead(el);if(!l)return;var f={};f[el.dataset.f]=el.value;
  if((el.value||"")===(l[el.dataset.f]||""))return;
  var before=l.status;api("/api/lead/update",{id:l.id,fields:f}).then(function(r){for(var k in r.lead)l[k]=r.lead[k];if(l.status!==before)render()}).catch(fail);
}

/* ---------- CRM : pipeline, sociétés, tâches, chiffres ---------- */
function eur(n){return Math.round(n||0).toLocaleString("fr-FR")+" €"}
function when(iso){return iso?new Date(iso).toLocaleDateString("fr-FR",{day:"numeric",month:"short"}):""}
function dueLabel(d){var t=new Date().toISOString().slice(0,10);return d<t?'<span class="late">en retard · '+esc(when(d))+"</span>":d===t?"aujourd'hui":esc(when(d))}
function crmNav(){return'<div class="actions" style="justify-content:space-between"><div class="seg" role="tablist" aria-label="CRM">'+[["board","Pipeline"],["companies","Sociétés"],["tasks","Tâches"],["report","Chiffres"]].map(function(v){return'<button role="tab" data-cv="'+v[0]+'" aria-selected="'+(C.view===v[0]&&!C.deal&&!C.company)+'">'+v[1]+"</button>"}).join("")+"</div>"}
function crmFail(e){fail(e);C.deal=null;C.company=null}
function renderCrm(){
  if(C.deal)return api("/api/crm/deal?id="+C.deal).then(paintDeal).catch(crmFail);
  if(C.company)return api("/api/crm/company?id="+C.company).then(paintCompany).catch(crmFail);
  if(C.view==="companies")return api("/api/crm/companies?q="+encodeURIComponent(C.q)).then(paintCompanies).catch(fail);

  if(C.view==="report")return api("/api/crm/report").then(paintReport).catch(fail);
  return api("/api/crm/board").then(paintBoard).catch(fail);
}

function composer(cid,did){

function paintDeal(v){
  var d=v.deal,c=v.company,open=d.status==="ouvert";C.lost=v.raisons_perte;
  var h='<button class="link" data-cback="1">← Pipeline</button><article class="card">';
  h+='<div class="meta"><span class="pill '+(d.status==="gagne"?"ok":d.status==="perdu"?"warn":"")+'">'+(d.status==="gagne"?"Gagnée":d.status==="perdu"?"Perdue : "+esc(d.lost_reason):"Ouverte")+"</span><span>"+d.days_in_stage+" j à cette étape</span>"+(d.alert?'<span class="urgent">'+esc(d.alert)+"</span>":"")+"</div>";
  h+='<div><h1 class="company"><button data-company="'+c.id+'" style="text-align:left">'+esc(c.name)+'</button></h1><input class="inl signal" style="margin-top:6px" data-df="title" aria-label="Titre de l\'opportunité" value="'+esc(d.title)+'"></div>';
  h+='<div class="fields"><label class="f"><span>Montant (€)</span><input data-df="amount" inputmode="decimal" value="'+esc(d.amount||"")+'"></label><label class="f"><span>Signature prévue</span><input type="date" data-df="close_date" value="'+esc(d.close_date||"")+'"></label><label class="f"><span>Responsable</span><input data-df="owner" value="'+esc(d.owner||"")+'"></label><label class="f"><span>Interlocuteur</span><select data-df="contact_id"><option value="">Aucun</option>'+v.contacts.map(function(x){return'<option value="'+x.id+'"'+(x.id===d.contact_id?" selected":"")+">"+esc(x.name||x.email)+"</option>"}).join("")+"</select></label></div>";
  if(open){
    h+='<div class="seg" role="tablist" aria-label="Étape" style="flex-wrap:wrap;border-radius:18px">'+v.stages.map(function(s){return'<button role="tab" data-stage="'+esc(s.id)+'" aria-selected="'+(s.id===d.stage)+'">'+esc(s.label)+"</button>"}).join("")+"</div>";
    h+='<div class="actions"><button class="btn go" data-close="gagne">Gagnée</button><button class="btn" data-lose="1">Perdue</button></div>';
    if(C.lose)h+='<div class="reasons"><span>Pourquoi :</span>'+v.raisons_perte.map(function(r){return'<button class="chip" data-close="perdu" data-reason="'+esc(r)+'">'+esc(r)+"</button>"}).join("")+"</div>";
  }else h+='<div class="actions"><button class="link" data-close="rouvrir">Rouvrir cette opportunité</button></div>';
  if(v.origine)h+='<div class="group"><h3>Pourquoi cette opportunité existe</h3><p class="note">'+link(v.origine.signal_url,v.origine.signal_title)+" · "+esc(v.origine.signal_source||"")+" · "+esc(when(v.origine.signal_date))+" · score "+v.origine.total+"/100</p></div>";
  if(v.tasks.length)h+='<div class="group"><h3>À faire</h3>'+tasksHtml(v.tasks)+"</div>";
  h+=composer(c.id,d.id)+'<div class="group"><h3>Historique</h3>'+tlHtml(v.timeline)+"</div></article>";
  $("main").className="";$("main").innerHTML=h;grow();
}

/* ---------- moteur de démonstration embarqué (mêmes règles que le serveur local) ---------- */
var M=null;
function mockReset(){M=JSON.parse(JSON.stringify(window.VIGIE_SEED));M.nextEv=1}
function refus(m){throw new Error(m)}
function mNow(){return new Date().toISOString()}
function mLead(id){var l=M.leads.filter(function(x){return x.id===id})[0];if(!l)refus("Lead introuvable.");return l}
function mEv(id,actor,kind,detail){(M.events[id]=M.events[id]||[]).push({at:mNow(),actor:actor,kind:kind,detail:detail||""})}
function mWarn(l){var w=[],cfg=M.state.workspaces[0].config,ok=(l._text+" "+cfg.offer+" "+cfg.value_prop+" "+cfg.tone.signature+" "+cfg.tone.optout).match(/\d+/g)||[];
  ((l.draft_body||"").match(/\d+/g)||[]).filter(function(n,i,a){return a.indexOf(n)===i}).forEach(function(n){if(ok.indexOf(n)<0)w.push("Le nombre « "+n+" » n'apparaît ni dans le signal ni dans votre offre.")});
  ((l.draft_body||"").match(PH)||[]).filter(function(n,i,a){return a.indexOf(n)===i}).forEach(function(p){w.push("Champ à compléter : "+p)});l.draft_warnings=w}
function mActor(){var a=M.state.settings.user_name;if(!a)refus("Indiquez votre nom : une validation est toujours nominative.");return a}
function mDecide(l,dec,reason){
  var a=mActor();
  if(dec==="valider"){
    if(["a_valider","observe","ecarte"].indexOf(l.status)<0)refus("Ce lead n'est pas en attente de validation.");
    if(!(l.draft_body||"").trim())refus("Aucun brouillon à valider. Rédigez ou générez le message d'abord.");
    var miss=((l.draft_subject||"")+l.draft_body).match(PH);
    if(miss)refus("Le message contient des champs à compléter : "+miss.filter(function(n,i,x){return x.indexOf(n)===i}).join(", ")+".");
    l.status="valide";l.validated_by=a;l.validated_at=mNow();mEv(l.id,a,"valide","étape "+l.step);
  }else if(dec==="rejeter"){l.status="rejete";l.reject_reason=reason||"non précisé";mEv(l.id,a,"rejete",l.reject_reason)}
  else if(dec==="observer"){l.status="observe";mEv(l.id,a,"observe","remis sous observation")}
  else if(dec==="annuler"){
    if(l.status==="envoye"){l.status="valide";l.sent_at=null;mEv(l.id,a,"annule","envoi annulé");cUnsent(l);return}
    if(["valide","rejete"].indexOf(l.status)<0)refus("Seule une validation ou un écart non envoyé peut être annulé.");
    l.status=l.draft_body?"a_valider":"observe";l.validated_by=null;l.validated_at=null;l.reject_reason=null;mEv(l.id,a,"annule","retour en attente de validation");
  }
}
function mEdit(l,f){
  if(l.status==="envoye"||l.status==="repondu")refus("Ce message est déjà parti : il ne peut plus être modifié.");
  var touched=false;
  for(var k in f){if(FIELDS.indexOf(k)<0)continue;var v=(f[k]||"").trim()||null;if(v===(l[k]||null))continue;
    if(k==="contact_email"){l.email_status=v?"saisi":"inconnu";l.email_note="saisi à la main par "+(M.state.settings.user_name||"vous")}
    if(k==="contact_name"){l.contact_source=v?"saisi à la main":null}
    if(["draft_subject","draft_body","contact_email"].indexOf(k)>=0)touched=true;l[k]=v}
  if(l.status==="valide"&&touched){l.status="a_valider";l.validated_by=null;l.validated_at=null}
  mWarn(l);
}
function mTemplate(l,step){
  var c=M.state.workspaces[0].config,hi=l.contact_name?"Bonjour "+l.contact_name.split(" ")[0]+",":"Bonjour,";
  var body=step>1?hi+"\n\nJe reviens vers vous au sujet de mon message précédent : "+l.signal_summary+"\n\nEst-ce un sujet pour vous en ce moment, ou préférez-vous que je revienne plus tard ?":hi+"\n\nJ'ai lu dans "+l.signal_source+" : « "+(l.signal_quote||l.signal_title).replace(/[ .]+$/,"")+" ».\n\n"+c.value_prop+"\n\nEst-ce un sujet sur lequel un échange de quinze minutes vous serait utile ?";
  if(step>1)l.draft_subject="Re: "+(l.draft_subject||l.company);else l.draft_subject=l.signal_title;
  l.draft_body=body+"\n\n"+c.tone.signature+"\n\n"+c.tone.optout;l.step=step;l.status="a_valider";l.validated_by=null;l.validated_at=null;mWarn(l);
}
function mReport(){
  var c=M.state.workspaces[0].config,L=M.leads,cnt=function(f){return L.filter(f).length},k={decouvert:L.length,valide:0,rejete:0,envoye:0,repondu:0};
  Object.keys(M.events).forEach(function(id){M.events[id].forEach(function(e){if(k[e.kind]!==undefined&&e.kind!=="decouvert")k[e.kind]++})});
  var types=L.map(function(l){return l.signal_type}).filter(function(t,i,a){return a.indexOf(t)===i});
